notify_alexa_timer_cancelled:
  alias: Notify Alexa Timer Cancelled
  description: Send notification when an Alexa timer is cancelled
  mode: queued
  max: 10
  fields:
    timer_entity:
      description: The timer sensor entity ID
      example: sensor.echo_show_kitchen_next_timer
      required: true
      selector:
        entity:
          domain: sensor
    notify_target:
      description: The notification service to use
      example: notify.livingroomtv
      required: true
      selector:
        text:
    timer_label:
      description: The label of the cancelled timer
      example: Test
      required: true
      selector:
        text:
    remaining_minutes:
      description: Minutes remaining when cancelled
      example: 15.5
      required: true
      selector:
        number:
          min: 0
          max: 1440
          step: 0.1
  sequence:
    - action: "{{ notify_target }}"
      data:
        title: "Timer Cancelled"
        message: >-
          {% set label = timer_label | default('', true) %}
          {% if label %}Timer "{{ label }}"{% else %}Timer{% endif %} 
          on {{ state_attr(timer_entity, 'friendly_name') }}
          was cancelled with {{ remaining_minutes }} minutes remaining
