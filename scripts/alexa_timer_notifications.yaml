notify_alexa_timer_set:
  alias: Notify Alexa Timer Set
  description: Send notification when an Alexa timer is set
  mode: queued
  max: 10
  fields:
    timer_entity:
      description: The timer sensor entity ID
      example: sensor.echo_show_kitchen_next_timer
      required: true
      selector:
        entity:
          domain: sensor
    notify_target:
      description: The notification service to use
      example: notify.livingroomtv
      required: true
      selector:
        text:
  sequence:
    - action: "{{ notify_target }}"
      data:
        title: "Timer Set"
        message: >-
          {% set label = state_attr(timer_entity, 'brief').active[0].label | default('', true) %}
          {% if label %}Timer "{{ label }}"{% else %}Timer{% endif %} 
          set for {{ (state_attr(timer_entity, 'brief').active[0].remainingTime / 60000) | round(0) }} minutes
          on {{ state_attr(timer_entity, 'friendly_name') }}

