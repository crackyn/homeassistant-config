            | rejectattr('entity_id', 'in', ['binary_sensor.occupancy_upstairs_hallway'])
            | map(attribute='state')
            | list
          %}
          {% set p_active  = persons | select('equalto', 'home') | list | count %}          
          {% if active  > 0 or p_active > 0 %}
            on
          {% else %}
            off
          {% endif %}

