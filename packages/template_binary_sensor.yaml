pkg_template_binary_sensors:

  # input_boolean:

  #   hide_header:
  #     name: Hide Header
  #     icon: mdi:eye-off

  #   hide_sidebar:
  #     name: Hide Sidebar
  #     icon: mdi:eye-off

  template:
    - binary_sensor:

      - unique_id: hide_header
        name: Hide Header
        device_class: connectivity
        state: "{{ is_state('input_boolean.hide_header', 'on') }}"

      - unique_id: hide_sidebar
        name: Hide Sidebar
        device_class: connectivity
        state: "{{ is_state('input_boolean.hide_sidebar', 'on') }}"

    ## Basement stairs ------------------------------------------------------------  
      - unique_id: 'motion_basement_stairs'
        name: 'Motion: Basement stairs'
        device_class: motion
        state: >
          {% set binary_sensors = states.binary_sensor
            | selectattr('entity_id', 'in', area_entities('basement_stairs'))
            | selectattr('attributes.device_class', 'in', ['motion', 'door'])
            | rejectattr('state', 'in', ['unknown', 'unavailable'])
            | rejectattr('entity_id', 'in', ['binary_sensor.motion_basement_stairs'])
            | map(attribute='state')
            | list
          %}
          {% set active = binary_sensors | select('equalto', 'on') | list | count %}          
          {% if active  > 0 %}
            on
          {% else %}
            off
          {% endif %}

