- id: '1772380130954'
  alias: 'Living Room: Motion'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.motion_living_room
    from:
    - 'off'
    to:
    - 'on'
  conditions:
  - condition: state
    entity_id: media_player.living_room
    state:
    - 'off'
  actions:
  - parallel:
    - if:
      - condition: state
        entity_id: media_player.living_room
        state:
        - 'off'
      then:
      - sequence:
        - action: media_player.volume_set
          metadata: {}
          data:
            volume_level: 0
          target:
            entity_id: media_player.living_room_echo_show
        - delay:
            hours: 0
            minutes: 0
            seconds: 10
            milliseconds: 0
        - action: alexa_devices.send_text_command
          metadata: {}
          data:
            device_id: 5fbf7c8b0a95470df8f3695266c2fa36
            text_command: Tune to fox
        - action: media_player.turn_on
          metadata: {}
          target:
            entity_id: media_player.living_room
          data: {}
        - action: media_player.volume_set
          metadata: {}
          data:
            volume_level: 0.5
          target:
            entity_id: media_player.living_room_echo_show
  mode: single
