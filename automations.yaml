- id: '1772532116866'
  alias: 'BLE Bermuda: Restart'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.chip_s_phone_ble_area
    - sensor.nikki_s_phone_ble_area
    to:
    - unknown
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions:
  - condition: and
    conditions:
    - condition: state
      entity_id: input_boolean.ble_restarted
      state:
      - 'off'
    - condition: or
      conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: person.chip
          state:
          - home
        - condition: state
          entity_id: sensor.chip_s_phone_ble_area
          state:
          - unknown
          for:
            hours: 0
            minutes: 5
            seconds: 0
      - condition: and
        conditions:
        - condition: state
          entity_id: person.nikki
          state:
          - home
        - condition: state
          entity_id: sensor.nikki_s_phone_ble_area
          state:
          - unknown
          for:
            hours: 0
            minutes: 5
            seconds: 0
  actions:
  - if:
    - condition: or
      conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: person.chip
          state:
          - home
        - condition: state
          entity_id: sensor.chip_s_phone_ble_area
          state:
          - unavailable
          for:
            hours: 0
            minutes: 5
            seconds: 0
    then:
    - action: homeassistant.reload_config_entry
      target:
        entity_id:
        - device_tracker.chip_s_phone_ble_bermuda_tracker
      data: {}
  - if:
    - condition: or
      conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: person.nikki
          state:
          - home
        - condition: state
          entity_id: sensor.nikki_s_phone_ble_area
          state:
          - unavailable
          for:
            hours: 0
            minutes: 5
            seconds: 0
    then:
    - action: homeassistant.reload_config_entry
      target:
        entity_id:
        - device_tracker.nikki_s_phone_ble_bermuda_tracker
      data: {}
  - action: input_boolean.turn_on
    metadata: {}
    target:
      entity_id: input_boolean.ble_restarted
    data: {}
  mode: single
