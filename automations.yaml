- id: '1771813265938'
  alias: 'Car: Auto Start'
  description: ''
  triggers:
  - trigger: time
    at: 05:30:00
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_today
    state:
    - 'on'
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.home_weather_station_temp
        below: 40.1
        above: -40
      sequence:
      - action: kia_uvo.start_climate
        metadata: {}
        data:
          climate: true
          defrost: true
          heating: '2'
          device_id: f699f97b4a8e5f3549097d5b362a8c9f
          duration: 15
          temperature: 70
          flseat: '8'
          frseat: '8'
    - conditions:
      - condition: numeric_state
        entity_id: sensor.home_weather_station_temp
        below: 70
        above: 40
      sequence:
      - action: kia_uvo.start_climate
        metadata: {}
        data:
          climate: true
          heating: '0'
          device_id: f699f97b4a8e5f3549097d5b362a8c9f
          duration: 15
          temperature: 69
          flseat: '7'
          frseat: '7'
    - conditions:
      - condition: numeric_state
        entity_id: sensor.home_weather_station_temp
        below: 120
        above: 70
      sequence:
      - action: kia_uvo.start_climate
        metadata: {}
        data:
          climate: true
          heating: '0'
          device_id: f699f97b4a8e5f3549097d5b362a8c9f
          duration: 15
          temperature: 66
  mode: single
